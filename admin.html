<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d2433" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icono-192.png" />
    <title>La Gran Aventura · Métricas</title>
    <style>
      :root { --fondo: #f4f1ea; --tarjeta: #ffffff; --texto: #1d2433; --suave: #5b6272; --borde: #e0dbd0; --acento: #2f7de1; --peligro: #c0392b; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { font-size: 26px; margin: 0 0 6px; }
      h2 { font-size: 19px; margin: 28px 0 10px; }
      p.intro { color: var(--suave); margin: 0 0 20px; }
      .totales { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
      .total { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; }
      .total .valor { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .total .etiqueta { color: var(--suave); font-size: 14px; }
      .tabla { overflow-x: auto; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
      th { font-size: 13px; color: var(--suave); font-weight: 600; }
      td.num, th.num { text-align: right; }
      tr:last-child td { border-bottom: 0; }
      .acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
      button, a.boton { font: 600 15px "Segoe UI", Roboto, Arial, sans-serif; border-radius: 10px; padding: 10px 18px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); cursor: pointer; text-decoration: none; }
      button.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
      button.peligro { color: var(--peligro); }
      #aviso { margin-top: 14px; color: var(--suave); min-height: 1.4em; }
      .vacio { padding: 16px; color: var(--suave); }
    </style>
  </head>
  <body>
    <main>
      <h1 id="titulo"></h1>
      <p class="intro" id="intro"></p>
      <section class="totales" id="totales"></section>
      <h2 id="tituloEtapas"></h2>
      <div class="tabla" id="etapas"></div>
      <h2 id="tituloMisiones"></h2>
      <div class="tabla" id="misiones"></div>
      <div class="acciones">
        <button class="principal" id="descargar"></button>
        <button id="enviar"></button>
        <button class="peligro" id="borrar"></button>
        <a class="boton" id="volver" href="./"></a>
      </div>
      <p id="aviso" role="status"></p>
    </main>
    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
