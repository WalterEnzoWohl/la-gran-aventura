<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d2433" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icono-192.png" />
    <link rel="apple-touch-icon" href="./icons/icono-192.png" />
    <title>La Gran Aventura</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2433; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
      #app { position: fixed; inset: 0; }
      #portada {
        position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        padding: 22px 32px; border-radius: 18px; background: rgba(29, 36, 51, 0.88); color: #fff; text-align: center;
        max-width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
      }
      #titulo { margin: 0; font-size: 30px; }
      #entrar {
        font: 700 22px "Segoe UI", Roboto, Arial, sans-serif; color: #fff; background: #2f7de1;
        border: 0; border-radius: 12px; padding: 14px 34px; cursor: pointer;
      }
      #entrar:disabled { opacity: 0.6; }
      #mensaje { margin: 0; font-size: 16px; color: #ffd166; }
      #mensaje:empty { display: none; }
      body.en-vr #portada, body.en-vr #reiniciar { display: none; }
      #reiniciar {
        position: fixed; top: 12px; right: 12px; z-index: 5;
        font: 600 15px "Segoe UI", Roboto, Arial, sans-serif; color: #fff; background: rgba(29, 36, 51, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 10px; padding: 8px 14px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button id="reiniciar" type="button"></button>
    <div id="portada">
      <h1 id="titulo"></h1>
      <button id="entrar" hidden></button>
      <p id="mensaje"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
